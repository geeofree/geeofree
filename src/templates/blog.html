---
layout: base.html
---

<article class="max-w-4xl mx-auto px-6 py-24">
  <header class="mb-16">
    <div class="mb-4">
      <a href="/#writing" class="text-sm font-bold uppercase tracking-widest text-indigo-600 hover:text-indigo-700 transition-colors">
        &larr; Back to Writing
      </a>
    </div>
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900 mb-6">{{ title }}</h1>
    <div class="flex items-center gap-4 text-slate-500 font-mono text-sm">
      <span>Last Modified: {{ page.date | formatDate }}</span>
      {% if description %}
      <span class="hidden md:inline">•</span>
      <span class="hidden md:inline italic">{{ description }}</span>
      {% endif %}
    </div>
  </header>

  <main class="prose prose-slate prose-indigo max-w-none">
    {{ content }}
  </main>
</article>
