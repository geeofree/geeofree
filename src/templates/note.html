---
layout: base.html
---

<article class="max-w-4xl mx-auto px-6 py-24">
  <header class="mb-16 flex flex-col md:flex-row gap-8 items-start md:items-center">
    <div class="p-6 bg-white rounded-3xl border border-slate-200 shadow-sm">
      <img src="{{ icon }}" alt="{{ description }}" class="w-24 h-24 object-contain">
    </div>
    <div>
      <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-4">{{ title }}</h1>
      <p class="text-xl text-slate-600 leading-relaxed">{{ description }}</p>
    </div>
  </header>

  <main class="prose prose-slate prose-indigo max-w-none">
    {{ content }}
  </main>
</article>
